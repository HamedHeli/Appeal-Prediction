name: Convert Rmd to Jupyter Notebook

on:
  push:
    branches:
      - DataAnalysis
    paths:
      - 'training-test/unbalanced-dataset/**/*.Rmd'
  workflow_dispatch:

jobs:
  convert-rmd:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install Jupytext
        run: pip install jupytext

      - name: Convert Rmd files to ipynb
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Find every .Rmd file, convert it, and stage the resulting .ipynb directly
          find training-test/unbalanced-dataset -name "*.Rmd" -print0 | while IFS= read -r -d '' rmd_file; do
            echo "Converting: $rmd_file"
            jupytext --to notebook "$rmd_file"
            
            # Derive the .ipynb filename and stage it safely
            ipynb_file="${rmd_file%.Rmd}.ipynb"
            if [ -f "$ipynb_file" ]; then
              git add "$ipynb_file"
            fi
          done

      - name: Commit and Push Jupyter Notebooks
        run: |
          if git diff --staged --quiet; then
            echo "No new notebook changes detected."
          else
            git commit -m "Auto-converted Rmd to Jupyter Notebook [skip ci]"
            git push origin DataAnalysis
          fi
